[package]
name = "arael-sketch-solver"
version = "0.6.3"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../docs/ARAEL_SKETCH.md"
description = "2D constraint-based sketch solver: entities, constraints, and optimization"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["constraint-solver", "sketch", "cad", "2d", "optimization"]
categories = ["mathematics", "science"]

[dependencies]
arael = { version = "0.6.3", path = ".." }
arael-sym = { version = "0.6.3", path = "../arael-sym" }
serde = { version = "1", features = ["derive"] }
nalgebra = "0.33"
faer = { version = "0.24", default-features = false, features = ["std"] }
web-time = "1"

[dev-dependencies]
serde_json = "1"
bincode = "1"
