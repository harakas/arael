name: Security audit

# Dependency vulnerability scan (cargo audit), per the project rule to run
# it periodically: weekly, on dependency changes, and on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
