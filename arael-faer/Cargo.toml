[package]
name = "arael-faer"
version.workspace = true
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
description = "faer extensions: block CSC storage, Schur-complement reduction, supernodal and envelope block Cholesky, conjugate gradients, and a nested-dissection ordering"
license = "MIT"
repository = "https://github.com/harakas/arael"
readme = "README.md"
keywords = ["sparse", "linear-algebra", "cholesky", "schur-complement", "nested-dissection"]
categories = ["mathematics", "science", "algorithms"]

[features]
# nano-gemm's AVX-512 microkernels (x86 only). Without it nano-gemm picks AVX2 by
# itself. Not a win on every machine: measure with `--example gemmbench`, which
# reports which path it took, before enabling it.
x86-v4 = ["nano-gemm/x86-v4"]

# faer's threaded kernels, and with them the supernodal factorization's own
# subtree and window parallelism. Off by default: everything here runs
# sequentially whatever thread count the caller passes.
threads = ["faer/rayon"]
# The feature's name through 0.8; the same thing.
rayon = ["threads"]

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
# The GEMM fallback for tile shapes with no unrolled kernel -- see schur.rs. Its
# execution API is unsafe (raw pointers and strides); the one call site proves
# and asserts its preconditions.
nano-gemm = "0.2.2"

# faer's x86-64 GEMM kernels, not called directly: the minimum moves a project
# that depends on arael off the yanked 0.1.20, which an older Cargo.lock keeps
# otherwise. Features as faer sets them (rayon only through faer/rayon).
[target.'cfg(target_arch = "x86_64")'.dependencies]
private-gemm-x86 = { version = "0.1.22", default-features = false }
