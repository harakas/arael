[package]
name = "arael-faer"
version = "0.8.4"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
description = "faer extensions: variable-block sparse matrix storage (block CSC), Schur-complement reduction, and a nested-dissection ordering"
license = "MIT"
repository = "https://github.com/harakas/arael"
readme = "README.md"
keywords = ["sparse", "linear-algebra", "cholesky", "schur-complement", "nested-dissection"]
categories = ["mathematics", "science", "algorithms"]

[features]
# nano-gemm's AVX-512 microkernels (x86 only). Without it nano-gemm picks AVX2 by
# itself. `--example gemmbench` reports which path it actually took.
#
# On the one x86 machine measured so far this HURTS: nano-gemm takes its AVX-512
# kernel only above a width threshold (m > 4 for f64, m > 8 for f32), and every
# tile shape above that threshold got 1.2-2.7x slower, while every shape below it
# was unchanged. At tile widths of 3 to 12 a 512-bit kernel is the wrong shape of
# hammer. The feature stays because that is one machine and one nano-gemm version:
# measure on yours with `gemmbench` before believing either result.
x86-v4 = ["nano-gemm/x86-v4"]

# faer's threaded kernels, and with them the supernodal factorization's own
# subtree parallelism. Off by default: everything here is sequential unless
# the caller asks for threads.
rayon = ["faer/rayon"]

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
# The GEMM fallback for tile shapes with no unrolled kernel -- see schur.rs. Its
# execution API is unsafe (raw pointers and strides); the one call site proves
# and asserts its preconditions.
nano-gemm = "0.2.2"
