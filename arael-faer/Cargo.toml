[package]
name = "arael-faer"
version = "0.7.1"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
description = "faer extensions staged for upstreaming: variable-block sparse matrix storage (block CSC) and Schur-complement reduction"
