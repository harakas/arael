[package]
name = "arael-macros"
version.workspace = true
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../README.md"
description = "Proc macros for the arael optimization framework: #[arael::model], constraint codegen"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["proc-macro", "optimization", "code-generation", "differentiation"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
# Generate the threaded sweeps over per-thread mirrors for every root.
# Enabled by arael's `rayon` feature; not meant to be set by hand.
rayon = []

[dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
arael-sym = { workspace = true }
arael-sym-macros = { workspace = true }
