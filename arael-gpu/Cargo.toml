[package]
name = "arael-gpu"
version.workspace = true
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
description = "arael's GPU runtime and kernels for CUDA and HIP: the block supernodal Cholesky, the Schur reduction and the LM loop's vector passes"
license = "MIT"
repository = "https://github.com/harakas/arael"
readme = "README.md"
keywords = ["sparse", "cholesky", "gpu", "cuda", "hip"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
# The runtimes. Without one there is no device; `arael` reports the backend
# unavailable. CUDA: the driver and NVRTC, loaded at run time, so a build
# needs no toolkit.
cuda = ["dep:cudarc"]
# HIP: the HIP runtime and hipRTC through our own bindings (src/hip_sys.rs),
# loaded at run time, so a build needs no ROCm.
hip = ["dep:libloading"]
# The CPU device: the kernels compiled by the host's C++ compiler and run
# on the CPU, for tests and CI without a GPU (src/cpu.rs).
cpu = ["dep:libloading"]
# Metal, on Apple silicon Macs: Metal.framework ships with macOS, so a build
# needs no Xcode. Nothing on other targets.
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]

[dependencies]
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "fallback-dynamic-loading",
    "cuda-version-from-build-system",
    "fallback-latest",
] }
libloading = { version = "0.8", optional = true }
arael-faer = { workspace = true }
bytemuck = "1"
# The user cache directory, for the kernel cache.
etcetera = "0.11"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSError", "NSRange", "NSString"] }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLEvent",
    "MTLFence",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }
