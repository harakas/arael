[package]
name = "arael-sym"
version = "0.3.1"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../README.md"
description = "Symbolic math library: expression trees, automatic differentiation, simplification, CSE, code generation"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["symbolic-math", "differentiation", "computer-algebra", "code-generation", "cse"]
categories = ["mathematics", "science"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs-header.html"]

[dependencies]
arael-sym-macros = { version = "0.3.1", path = "../arael-sym-macros" }
