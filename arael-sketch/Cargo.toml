[package]
name = "arael-sketch"
version = "0.1.0"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../README.md"
description = "2D constraint-based sketch solver and interactive editor"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["constraint-solver", "sketch", "cad", "2d", "egui"]
categories = ["graphics", "mathematics"]

[dependencies]
arael = { version = "0.1.0", path = ".." }
serde = { version = "1", features = ["derive"] }
eframe = { version = "0.31", optional = true }
bincode = { version = "1", optional = true }
rfd = { version = "0.15", optional = true }
pollster = { version = "0.4", optional = true }

[features]
editor = ["eframe", "bincode", "rfd", "pollster"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "editor"
required-features = ["editor"]
