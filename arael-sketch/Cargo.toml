[package]
name = "arael-sketch"
version.workspace = true
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../docs/ARAEL_SKETCH.md"
description = "Interactive 2D sketch editor with real-time constraint solving"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["constraint-solver", "sketch", "cad", "2d", "egui"]
categories = ["graphics", "mathematics"]

[dependencies]
arael = { workspace = true }
arael-sym = { workspace = true }
arael-sketch-solver = { workspace = true }
arael-sketch-backend = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui_extras = "0.31"
egui_commonmark = "0.20"
bincode = "1"
rfd = "0.15"
pollster = "0.4"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
