[package]
name = "arael-sketch"
version = "0.4.1"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../README.md"
description = "Interactive 2D sketch editor with real-time constraint solving"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["constraint-solver", "sketch", "cad", "2d", "egui"]
categories = ["graphics", "mathematics"]

[dependencies]
arael = { version = "0.4.1", path = ".." }
arael-sym = { version = "0.4.1", path = "../arael-sym" }
arael-sketch-solver = { version = "0.4.1", path = "../arael-sketch-solver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
faer = { version = "0.24", default-features = false, features = ["std"] }
eframe = "0.31"
egui_extras = "0.31"
egui_commonmark = "0.20"
bincode = "1"
rfd = "0.15"
pollster = "0.4"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
sha2 = "0.10"
base64 = "0.22"
form_urlencoded = "1"
rand = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
