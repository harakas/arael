[package]
name = "loc-bench"
version = "0.1.0"
edition = "2021"
# plain `cargo run` stays the benchmark; fpbench is opt-in via --bin
default-run = "loc-bench"
publish = false

# Standalone workspace, same pattern as benchmarks/slam and benchmarks/pgo.
[workspace]

[dependencies]
arael = { path = "../.." }
bench-harness = { path = "../harness", features = ["factrs"] }
tiny-solver = "0.18.0"
factrs = "0.3.0"
rand = "0.9"
rand_distr = "0.5"
log = "0.4"

[profile.release]
debug = false
