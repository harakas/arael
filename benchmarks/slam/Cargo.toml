[package]
name = "slam-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace, same pattern as benchmarks/pgo and benchmarks/bal.
[workspace]

[features]
# Forward arael's optional sparse backends (selected via SLAM_ARAEL_SOLVER=
# eigen|cholmod|cholmod_gpl; default faer).
eigen = ["arael/eigen"]
cholmod = ["arael/cholmod", "eigen"]
# WARNING: cholmod-gpl links CHOLMOD's GPL-licensed Supernodal module; the
# resulting binary is subject to the GPL.
cholmod-gpl = ["arael/cholmod-gpl", "cholmod"]

[dependencies]
arael = { path = "../.." }
bench-harness = { path = "../harness", features = ["factrs"] }
arael-faer = { path = "../../arael-faer" }
tiny-solver = "0.18.0"
factrs = "0.3.0"
rand = "0.9"
rand_distr = "0.5"
libc = "0.2"
log = "0.4"
image = "0.25"

[profile.release]
debug = false
# cgu=1: the timed code is inlined generic solver code whose optimization
# depends on how rustc partitions the crate, so timings otherwise shift with
# unrelated code in the binary. Pins them; costs only compile time.
codegen-units = 1
