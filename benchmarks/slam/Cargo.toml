[package]
name = "slam-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace, same pattern as benchmarks/pgo and benchmarks/bal.
[workspace]

[features]
# Forward arael's optional sparse backends (selected via SLAM_ARAEL_SOLVER=
# eigen|cholmod|cholmod_gpl; default faer).
eigen = ["arael/eigen"]
cholmod = ["arael/cholmod", "eigen"]
# WARNING: cholmod-gpl links CHOLMOD's GPL-licensed Supernodal module; the
# resulting binary is subject to the GPL.
cholmod-gpl = ["arael/cholmod-gpl", "cholmod"]

[dependencies]
arael = { path = "../.." }
tiny-solver = "0.18.0"
factrs = "0.3.0"
rand = "0.9"
rand_distr = "0.5"
libc = "0.2"
log = "0.4"

[profile.release]
debug = false
