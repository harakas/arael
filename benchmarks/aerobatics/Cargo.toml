[package]
name = "aerobatics-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace, same pattern as benchmarks/slam, pgo, bal.
[workspace]

[dependencies]
arael = { path = "../.." }

[profile.release]
debug = false
# cgu=1: the timed code is inlined generic solver code whose optimization
# depends on how rustc partitions the crate, so timings otherwise shift with
# unrelated code in the binary. Pins them; costs only compile time.
codegen-units = 1
