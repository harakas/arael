<text x="24" y="268" font-size="10.5" fill="#908f88">Every bar reaches its problem's common optimum, cross-validated against all systems.</text>
<text x="24" y="282" font-size="10.5" fill="#908f88">arael cholmod-gpl is the optional CHOLMOD supernodal backend (GPL-licensed); the localization rows use arael's band-Cholesky solver on the block-tridiagonal Hessian.</text>
<text x="24" y="296" font-size="10.5" fill="#908f88">tiny-solver omitted for scale: 320.7 ms/iter on the SLAM panel, 88.5 ms/iter on the Pi 5.</text>
