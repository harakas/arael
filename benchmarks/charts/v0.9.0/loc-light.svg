<text x="18" y="442" font-size="10.5" fill="#85847c">Setup is assembly, ordering and symbolic factorization: done once, reused by every later iteration. arael's band solver has almost none.</text>
<text x="18" y="456" font-size="10.5" fill="#85847c">Ceres is sparse_cholesky (a fixed map leaves nothing to marginalize); SymForce is f64. Every bar reaches the common optimum.</text>
<text x="18" y="470" font-size="10.5" fill="#85847c">The Pi Zero (ARMv6) has no C++ cross-build, so only arael and factrs run there.</text>
</svg>
