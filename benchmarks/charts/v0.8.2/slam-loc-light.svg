<text x="18" y="444" font-size="10.5" fill="#85847c">Time excludes setup -- assembly, ordering and symbolic factorization -- which every system pays once, during its first iteration.</text>
<text x="18" y="458" font-size="10.5" fill="#85847c">Peak memory is the process high-water mark (VmHWM), each solver measured in a process of its own. Each row is ordered by its own metric.</text>
<text x="18" y="472" font-size="10.5" fill="#85847c">The SLAM memory axis is linear to 200 MB and logarithmic past the dashed line, so one outlier does not flatten the rest.</text>
<text x="18" y="486" font-size="10.5" fill="#85847c">The SLAM scene has no loop closure: the trajectory does not revisit, so each landmark is seen from one run of consecutive poses.</text>
<text x="18" y="500" font-size="10.5" fill="#85847c">Every bar reaches its problem's common optimum, cross-validated against all systems.</text>
<text x="18" y="514" font-size="10.5" fill="#85847c">arael solves the SLAM panel with its Schur solver, the localization panel with its band solver.</text>
</svg>
