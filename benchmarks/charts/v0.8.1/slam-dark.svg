<text x="18" y="442" font-size="10.5" fill="#908f88">Setup is assembly, ordering and symbolic factorization: done once, reused by every later iteration.</text>
<text x="18" y="456" font-size="10.5" fill="#908f88">Ceres is sparse_schur, SymForce is f64; the inexact iterative_schur is omitted. Every bar reaches the common optimum.</text>
<text x="18" y="470" font-size="10.5" fill="#908f88">The Pi Zero W (ARMv6) has no C++ cross-build, so only arael and factrs run there.</text>
