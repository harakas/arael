<text x="18" y="249" font-size="10.5" fill="#85847c">Excludes setup -- assembly, ordering and symbolic factorization -- which every system pays once, during its first iteration.</text>
<text x="18" y="263" font-size="10.5" fill="#85847c">Every bar reaches its problem's common optimum, cross-validated against all systems.</text>
<text x="18" y="277" font-size="10.5" fill="#85847c">arael solves the SLAM panel with its Schur solver, the localization panel with its band solver.</text>
