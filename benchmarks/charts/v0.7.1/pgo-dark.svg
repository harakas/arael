<text x="24" y="440" font-size="10.5" fill="#908f88">Excludes setup -- assembly, ordering and symbolic factorization -- which every system pays once, during its first iteration.</text>
<text x="24" y="454" font-size="10.5" fill="#908f88">Every bar is validated against its dataset's common optimum (cost within 1%, rigid-aligned RMSE under 5 cm).</text>
<text x="24" y="468" font-size="10.5" fill="#908f88">* arael f32 on the parking garage passes the cost gate (0.02% above the optimum) but not the geometric one -- a single-precision floor shared by SymForce's f32.</text>
