<text x="18" y="249" font-size="10.5" fill="#908f88">Setup is assembly, ordering and symbolic factorization: done once, reused by every later iteration. arael's band solver has almost none to do.</text>
<text x="18" y="263" font-size="10.5" fill="#908f88">Every bar reaches its problem's common optimum, cross-validated against all systems.</text>
<text x="18" y="277" font-size="10.5" fill="#908f88">arael solves the SLAM panel with its Schur solver, the localization panel with its band solver.</text>
