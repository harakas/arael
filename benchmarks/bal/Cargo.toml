[package]
name = "bal-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace, same pattern as benchmarks/pgo.
[workspace]

[features]
# Adds the "arael LM f64 cholmod-gpl" row (CHOLMOD supernodal backend).
# WARNING: cholmod-gpl links CHOLMOD's GPL-licensed Supernodal module; the
# resulting binary is subject to the GPL.
cholmod-gpl = ["arael/cholmod-gpl"]

[dependencies]
arael = { path = "../..", features = ["rayon"] }
arael-faer = { path = "../../arael-faer" }
bench-harness = { path = "../harness" }

[profile.release]
debug = false
# cgu=1: the timed code is inlined generic solver code whose optimization
# depends on how rustc partitions the crate, so timings otherwise shift with
# unrelated code in the binary. Pins them; costs only compile time.
codegen-units = 1

# Added by cargo-arael. Model code generation runs inside the arael
# proc-macros at compile time, and cargo builds proc-macros unoptimized
# in every profile -- so a large model spends most of its build
# expanding. These build just the macro crates optimized, without
# optimizing your own debug build.
[profile.dev.package.arael-macros]
opt-level = 3
[profile.dev.package.arael-sym]
opt-level = 3
[profile.release.package.arael-macros]
opt-level = 3
[profile.release.package.arael-sym]
opt-level = 3
