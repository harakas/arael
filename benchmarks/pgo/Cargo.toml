[package]
name = "pgo-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: keeps tiny-solver and its dependency tree out of
# the main arael lockfile.
[workspace]

[dependencies]
arael = { path = "../.." }
bench-harness = { path = "../harness", features = ["factrs"] }
tiny-solver = "0.18.0"
serde_json = "1"
num = "0.4"
factrs = "0.3.0"
# factrs resolves faer 0.23 while arael is on 0.24; the counting solver
# implements factrs's LinearSolver trait, so it must speak factrs's faer.
faer23 = { package = "faer", version = "0.23.2", default-features = false, features = ["std", "sparse-linalg"] }
nalgebra = "0.33"
log = "0.4"
libc = "0.2"

[profile.release]
debug = false
# cgu=1: the timed code is inlined generic solver code whose optimization
# depends on how rustc partitions the crate, so timings otherwise shift with
# unrelated code in the binary. Pins them; costs only compile time.
codegen-units = 1

[profile.dev.package.arael-macros]
opt-level = 3
[profile.dev.package.arael-sym]
opt-level = 3
