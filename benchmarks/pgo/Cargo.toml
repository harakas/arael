[package]
name = "pgo-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: keeps tiny-solver and its dependency tree out of
# the main arael lockfile.
[workspace]

[dependencies]
arael = { path = "../.." }
tiny-solver = "0.18.0"
serde_json = "1"
factrs = "0.3.0"
# factrs resolves faer 0.23 while arael is on 0.24; the counting solver
# implements factrs's LinearSolver trait, so it must speak factrs's faer.
faer23 = { package = "faer", version = "0.23.2", default-features = false, features = ["std", "sparse-linalg"] }
nalgebra = "0.33"
log = "0.4"
libc = "0.2"

[profile.release]
debug = false
