<text x="24" y="440" font-size="10.5" fill="#85847c">Every bar is validated against its dataset's common optimum (cost within 1%, rigid-aligned RMSE under 5 cm).</text>
<text x="24" y="454" font-size="10.5" fill="#85847c">tiny-solver omitted for scale: 20.8 / 84.8 / 84.5 / 95.8 ms per step across the four panels (6.0-9.3x arael).</text>
<text x="24" y="468" font-size="10.5" fill="#85847c">GTSAM (batch) did not converge on city10000; its incremental ISAM2 solves it in 10.4 s.</text>
<text x="24" y="482" font-size="10.5" fill="#85847c">* arael f32 on the parking garage passes the cost gate (0.03% above the optimum) but not the geometric one -- a single-precision floor shared by SymForce's f32.</text>
