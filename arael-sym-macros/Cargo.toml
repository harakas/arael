[package]
name = "arael-sym-macros"
version = "0.6.0"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../docs/SYM.md"
description = "Proc macros for arael-sym: the sym! auto-clone macro"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["proc-macro", "symbolic-math", "clone"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
