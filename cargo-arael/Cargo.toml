[package]
name = "cargo-arael"
version.workspace = true
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
description = "Cargo subcommand generating C, C++, Python and JavaScript (WebAssembly) interfaces for arael root models"
license = "MIT"
repository = "https://github.com/harakas/arael"
readme = "README.md"
keywords = ["cargo", "ffi", "code-generation", "optimization"]
categories = ["development-tools::cargo-plugins", "development-tools::ffi"]

[[bin]]
name = "cargo-arael"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
