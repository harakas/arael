[package]
name = "arael-sketch-backend"
version.workspace = true
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
readme = "../docs/ARAEL_SKETCH.md"
description = "Headless backend for arael-sketch: commands, actions, history, MCP server"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["constraint-solver", "sketch", "cad", "2d", "mcp"]
categories = ["mathematics", "science"]

[dependencies]
arael = { workspace = true }
arael-sym = { workspace = true }
arael-sketch-solver = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
nalgebra = "0.33"
faer = { version = "0.24", default-features = false, features = ["std"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
sha2 = "0.10"
base64 = "0.22"
form_urlencoded = "1"
rand = "0.9"
