[workspace]
members = ["arael-faer", "arael-macros", "arael-sym", "arael-sym-macros", "arael-sketch", "arael-sketch-backend", "arael-sketch-solver", "cargo-arael"]

# One version for every crate of the workspace. A `-dev` suffix marks the
# tree between releases: cargo never picks a pre-release for a plain
# `"0.9"` requirement, so nothing built from here is mistaken for a
# release. Cutting one sets the number here and in the table below.
[workspace.package]
version = "0.9.0-dev"

[workspace.dependencies]
arael = { version = "0.9.0-dev", path = "." }
arael-macros = { version = "0.9.0-dev", path = "arael-macros" }
arael-sym = { version = "0.9.0-dev", path = "arael-sym" }
arael-sym-macros = { version = "0.9.0-dev", path = "arael-sym-macros" }
arael-faer = { version = "0.9.0-dev", path = "arael-faer" }
arael-sketch-solver = { version = "0.9.0-dev", path = "arael-sketch-solver" }
arael-sketch-backend = { version = "0.9.0-dev", path = "arael-sketch-backend" }

[package]
name = "arael"
version.workspace = true
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
description = "Nonlinear optimization framework with compile-time symbolic differentiation"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["optimization", "nonlinear", "least-squares", "symbolic-math", "slam"]
categories = ["science::robotics", "mathematics", "algorithms"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs-header.html"]

[features]
lapack = ["dep:lapack-sys"]
eigen = ["dep:cc"]
cholmod = ["eigen"]
# WARNING: CHOLMOD's Supernodal module is GPL-licensed (unlike the Simplicial
# module `cholmod` binds, which is LGPL). Enabling this feature makes the
# resulting binary subject to the GPL. Enable knowingly.
cholmod-gpl = ["cholmod"]
# Run the linear solve on rayon's thread pool, and let a root opt its cost
# and assembly sweeps in with `#[arael(root, par)]` (experimental, limited
# model support). Off by default: arael is single-threaded, and an edge
# target usually wants it that way. Without it `LmConfig::num_threads` must
# stay 1, and a `par` root is the sequential one.
rayon = ["dep:rayon", "faer/rayon", "arael-faer/rayon", "arael-macros/rayon"]

[dependencies]
arael-macros = { workspace = true }
arael-sym = { workspace = true }
arael-faer = { workspace = true }
inventory = "0.3"
rayon = { version = "1.11", optional = true }
num = "0.4"
nalgebra = "0.33"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
lapack-sys = { version = "0.15", optional = true }
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
image = "0.25"
rustyline = "15"
dirs = "5"
trybuild = "1"

[[bench]]
name = "benchmarks"
harness = false

# Model code generation runs inside these crates at compile time, so a dev
# build otherwise expands every model through unoptimized macro code. Building
# them optimized leaves the debug build itself unoptimized.
[profile.dev.package.arael-macros]
opt-level = 3
[profile.dev.package.arael-sym]
opt-level = 3
[profile.release.package.arael-macros]
opt-level = 3
[profile.release.package.arael-sym]
opt-level = 3
