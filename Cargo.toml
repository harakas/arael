[workspace]
members = ["arael-faer", "arael-macros", "arael-sym", "arael-sym-macros", "arael-sketch", "arael-sketch-backend", "arael-sketch-solver", "cargo-arael"]

[package]
name = "arael"
version = "0.8.2"
edition = "2024"
authors = ["Indrek Mandre <indrek@mare.ee>"]
description = "Nonlinear optimization framework with compile-time symbolic differentiation"
license = "MIT"
repository = "https://github.com/harakas/arael"
keywords = ["optimization", "nonlinear", "least-squares", "symbolic-math", "slam"]
categories = ["science::robotics", "mathematics", "algorithms"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs-header.html"]

[features]
lapack = ["dep:lapack-sys"]
eigen = ["dep:cc"]
cholmod = ["eigen"]
# WARNING: CHOLMOD's Supernodal module is GPL-licensed (unlike the Simplicial
# module `cholmod` binds, which is LGPL). Enabling this feature makes the
# resulting binary subject to the GPL. Enable knowingly.
cholmod-gpl = ["cholmod"]
# Let the sparse factorization and triangular solve run on faer's rayon thread
# pool. Off by default: arael is single-threaded, and an edge target usually
# wants it that way. Without it `LmConfig::num_threads` must stay 1.
rayon = ["faer/rayon", "arael-faer/rayon"]

[dependencies]
arael-macros = { version = "0.8.2", path = "arael-macros" }
arael-sym = { version = "0.8.2", path = "arael-sym" }
arael-faer = { version = "0.8.2", path = "arael-faer" }
inventory = "0.3"
num = "0.4"
nalgebra = "0.33"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
lapack-sys = { version = "0.15", optional = true }
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
image = "0.25"
rustyline = "15"
dirs = "5"
trybuild = "1"

[[bench]]
name = "benchmarks"
harness = false
